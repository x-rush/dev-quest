name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      execute_examples:
        description: 'Run eligible examples in the disposable CI runner (never on a trusted workstation)'
        type: boolean
        default: false
defaults:
  run:
    # GitHub invokes explicit bash with -e -o pipefail; tee cannot hide a failed check.
    shell: bash
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  document-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: mkdir -p /tmp/dq-reports
      - name: Verifier regression tests
        run: python -m unittest discover -s shared-resources/tools/code-block-verify -p 'test_verifier.py'
      - name: Pipeline exit-status regression
        run: python shared-resources/tools/code-block-verify/test_pipeline.py
      - name: Local file links
        if: always()
        run: python shared-resources/tools/code-block-verify/link_check.py . --strict | tee /tmp/dq-reports/links.txt
      - name: Heading anchors
        if: always()
        run: python shared-resources/tools/document-quality/check_anchors.py --report /tmp/dq-reports/anchors.json
      - name: Closed code fences
        if: always()
        run: python shared-resources/tools/document-quality/check_fences.py | tee /tmp/dq-reports/fences.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: document-integrity
          path: /tmp/dq-reports/
  code-inventory:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Set up PHP matching the documented baseline
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: none
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          pip install pyyaml==6.0.3
          npm install -g typescript@5.9.3
          rustup component add rustfmt
          rustfmt --version
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 5 ? 0 : 1);'
      - name: Build and test runners
        run: |
          mkdir -p /tmp/dq-verify/parsego
          go build -o /tmp/dq-verify/parsego/parsego shared-resources/tools/code-block-verify/parsego/main.go
          python shared-resources/tools/code-block-verify/test_parsego.py /tmp/dq-verify/parsego/parsego
          python -m unittest discover -s shared-resources/tools/code-block-verify -p 'test_verifier.py'
      - name: Extract inventory
        run: python shared-resources/tools/code-block-verify/extract_blocks.py .
      # Only a disposable hosted runner: checkout credentials are not persisted,
      # no repository secrets are passed, and contents permission stays read-only.
      - name: Verify and retain actual exit status
        env:
          EXECUTE: ${{ inputs.execute_examples }}
        run: |
          args=()
          if [ "$EXECUTE" = true ]; then args+=(--execute); fi
          python shared-resources/tools/code-block-verify/verify.py --strict "${args[@]}" | tee shared-resources/tools/code-block-verify/run.log
      - name: Publish summary
        if: always()
        run: |
          if [ -f shared-resources/tools/code-block-verify/summary.json ]; then
            echo '## Code inventory result' >> "$GITHUB_STEP_SUMMARY"
            echo 'Download code-verification for every block, complete diagnostics and tool versions.' >> "$GITHUB_STEP_SUMMARY"
            cat shared-resources/tools/code-block-verify/summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Verification did not finish; download partial logs. This is not a passing verification.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: code-verification
          retention-days: 14
          path: |
            shared-resources/tools/code-block-verify/manifest.jsonl*
            shared-resources/tools/code-block-verify/results.jsonl*
            shared-resources/tools/code-block-verify/commands.jsonl
            shared-resources/tools/code-block-verify/summary.json
            shared-resources/tools/code-block-verify/report.md
            shared-resources/tools/code-block-verify/run.log
